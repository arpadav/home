# enable scrolling - buffer size
set -g history-limit 65536
# enable scrolling - mouse
set -g mouse on
# enable scrolling - keyboard
set-window-option -g mode-keys vi
# set terminal color, so no weird DA/DEC private mode reports
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
# in copy moad, send to xclip for system keyboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# plugins - session save/restore across reboots (tpm clones into ~/.tmux/plugins)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# restore last saved environment when tmux starts
set -g @continuum-restore 'on'
# restore nvim/vim sessions too (needs Session.vim / obsession)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
# bootstrap tpm on a fresh machine
if "test ! -d ~/.tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
